name: Deploy Hugging Face development speech backend
on:
  push:
    branches: [development/verify-hf-access]
    paths:
      - huggingface/space/**
      - huggingface/tests/**
      - .github/workflows/deploy-hf-development.yml
permissions:
  contents: read
concurrency:
  group: lanxgrow-hf-development
  cancel-in-progress: false
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deployment and utility test dependencies
        run: python -m pip install 'huggingface_hub>=1.16,<3' numpy scipy soundfile
      - name: Compile and test audio processing
        run: |
          python -m compileall -q huggingface/space
          python -m unittest discover -s huggingface/tests -v
      - name: Deploy only the five development Space source files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import sys
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download
          repo = 'Apoorva-Mishra/lanxgrow-learning-dev'
          token = os.environ.get('HF_TOKEN', '').strip()
          if not token:
              sys.exit('HF_TOKEN is unavailable.')
          api = HfApi(token=token)
          api.auth_check(repo_id=repo, repo_type='space', write=True)
          source = Path('huggingface/space')
          files = ['app.py', 'components.py', 'requirements.txt', 'packages.txt', 'README.md']
          api.upload_folder(repo_id=repo, repo_type='space', folder_path=source,
              allow_patterns=files, commit_message='Deploy speech backend from isolated GitHub development branch')
          revision = api.repo_info(repo, repo_type='space').sha
          for name in files:
              remote = Path(hf_hub_download(repo_id=repo, repo_type='space', filename=name,
                  revision=revision, token=token))
              if hashlib.sha256(remote.read_bytes()).digest() != hashlib.sha256((source/name).read_bytes()).digest():
                  sys.exit('Source verification failed: ' + name)
          print('PASS: Five source files uploaded and verified at revision ' + revision)
          print('No delete patterns, hardware changes or production website deployment performed.')
          print('Hugging Face build/runtime verification is a separate step.')
          PY
