name: Generate Lan-X voice samples
on:
  push:
    branches: [development/verify-hf-access]
    paths: [.github/workflows/generate-lanx-voice-samples.yml]
permissions:
  contents: write
concurrency:
  group: lanxgrow-voice-sample-test
  cancel-in-progress: false
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/verify-hf-access
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install the speech API test client
        run: python -m pip install gradio_client==2.7.2 soundfile numpy
      - name: Generate the exact same script with the two installed voices
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -u - <<'PY'
          import json, os, shutil, time
          from pathlib import Path
          import numpy as np
          import soundfile as sf
          from gradio_client import Client

          folder = Path('huggingface/voice-samples')
          folder.mkdir(parents=True, exist_ok=True)
          script = ("Welcome to LanXgrow. I'm Lan-X, your English communication mentor. "
                    "Take your time. Speak in your own words. "
                    "Let's build your confidence, one conversation at a time.")
          client = Client('Apoorva-Mishra/lanxgrow-learning-dev',
              token=os.environ['HF_TOKEN'], verbose=False, analytics_enabled=False)
          records = []
          for label, model_voice, filename in [
              ('American', 'af_heart', 'voice-01-american.wav'),
              ('British', 'bf_emma', 'voice-02-british.wav'),
          ]:
              start = time.monotonic()
              generated, metadata = client.predict(script, label, api_name='/synthesize')
              samples, rate = sf.read(generated, always_2d=True)
              if rate != 24000 or not np.isfinite(samples).all() or samples.size == 0:
                  raise RuntimeError('Invalid generated audio for ' + label)
              peak = float(np.max(np.abs(samples)))
              rms = float(np.sqrt(np.mean(samples ** 2)))
              if peak < 0.001 or rms < 0.0001:
                  raise RuntimeError('Output audio is effectively silent for ' + label)
              shutil.copyfile(generated, folder / filename)
              records.append({'label': label, 'model_voice': model_voice,
                  'filename': filename, 'sample_rate': rate,
                  'duration_seconds': round(len(samples) / rate, 2),
                  'request_seconds': round(time.monotonic() - start, 2),
                  'peak': peak, 'rms': rms})
              print('PASS: generated non-silent ' + label + ' sample.')
          (folder / 'results.json').write_text(json.dumps(
              {'script': script, 'samples': records,
               'note': 'Technical checks only. Human review of naturalness, pronunciation and confidence remains pending.'},
              indent=2))
          (folder / 'README.md').write_text(
              '# Lan-X voice comparison\n\n'
              'Both samples use Kokoro-82M at speed 1 and exactly the same script.\n\n'
              '- Voice 1: American English, af_heart.\n'
              '- Voice 2: British English, bf_emma.\n\n'
              'These are synthetic, non-personal development samples. '
              'No final voice has been selected. Technical checks do not establish perceived quality.\n\n'
              + script + '\n')
          PY
      - name: Save samples only on the development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add huggingface/voice-samples
          if git diff --cached --quiet; then
            echo 'Samples already saved.'
          else
            git commit -m 'Save generated Lan-X voice comparison samples'
            git push origin HEAD:development/verify-hf-access
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lanx-voice-samples
          path: huggingface/voice-samples/
          retention-days: 30
