name: Refine shortlisted voices and audition interviewer candidates
on:
  push:
    branches: [development/verify-hf-access]
    paths:
      - .github/workflows/refine-shortlisted-voices.yml
      - huggingface/experiments/refine_shortlisted_voices.py
permissions:
  contents: write
concurrency:
  group: lanx-shortlisted-voice-audition
  cancel-in-progress: false
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/verify-hf-access
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install gradio_client==2.7.2 soundfile==0.13.1 numpy
      - name: Synthetic voice auditions only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u huggingface/experiments/refine_shortlisted_voices.py
      - name: Preserve generated samples on development branch only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add huggingface/voice-samples/shortlist-refinement
          if ! git diff --cached --quiet; then
            git commit -m 'Save shortlisted voice variants and interviewer audition evidence'
            git pull --rebase origin development/verify-hf-access
            git push origin HEAD:development/verify-hf-access
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shortlisted-voice-refinement
          path: huggingface/voice-samples/shortlist-refinement/
          retention-days: 30
