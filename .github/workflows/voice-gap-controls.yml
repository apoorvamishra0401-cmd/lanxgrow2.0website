name: Diagnose accent and voice identity gaps
on:
  push:
    branches: [development/verify-hf-access]
    paths: [.github/workflows/voice-gap-controls.yml]
permissions:
  contents: write
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/verify-hf-access
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install gradio_client==2.7.2 soundfile==0.13.1 numpy edge-tts==7.2.3
      - name: Refine synthetic voices without production changes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u huggingface/experiments/voice_gap_controls.py
      - name: Save audition evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add huggingface/voice-samples/voice-gap-controls
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve independent VoxCPM2 interviewer audition results'
            git pull --rebase origin development/verify-hf-access
            git push origin HEAD:development/verify-hf-access
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-gap-controls-audition
          path: huggingface/voice-samples/voice-gap-controls/
          retention-days: 30
