name: LanXgrow isolated review checks
on:
  push:
    branches:
      - dev/lanx-founder-review-20261110
      - dev/lanx01-role-dashboard-20261111
      - dev/lanx02-interview-assessment-20261111
      - dev/lanx03-ai-soul-evaluation-20261111
      - dev/lanx04-admin-access-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9f683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
