name: LanXgrow isolated review checks
on:
  push:
    branches:
      - dev/lanx-founder-review-20261110
      - dev/lanx01-role-dashboard-20261111
      - dev/lanx02-interview-assessment-20261111
      - dev/lanx03-ai-soul-evaluation-20261111
      - dev/lanx04-admin-access-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/test-audience-routes.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Start isolated local preview and browser matrix
        if: github.ref_name == 'dev/lanx01-role-dashboard-20261111'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/dashboard/student > /dev/null; then break; fi
            sleep 1
          done
          node scripts/test-audience-browser.mjs
      - name: Upload browser screenshots
        if: always() && github.ref_name == 'dev/lanx01-role-dashboard-20261111'
        uses: actions/upload-artifact@v4
        with:
          name: lanx01-audience-browser-evidence
          path: browser-evidence/
          if-no-files-found: ignore
