name: LanXgrow isolated review checks
on:
  push:
    branches:
      - dev/lanx00-app-integration-20261111
      - dev/lanx-founder-review-20261110
      - dev/lanx01-role-dashboard-20261111
      - dev/lanx02-interview-assessment-20261111
      - dev/lanx03-ai-soul-evaluation-20261111
      - dev/lanx04-admin-access-20261111
      - dev/lanx-getstarted-first-report-tour-20261112
  pull_request:
    branches:
      - dev/lanx-founder-review-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/test-introduction.mjs
      - run: node --test scripts/test-audience-routes.mjs
      - run: node --experimental-strip-types --test scripts/test-interview-lifecycle.mjs scripts/test-interview-transport.mjs scripts/test-interview-http.mjs
      - run: node --test scripts/test-evaluation.mjs src/admin/tests/server-access.test.mjs
      - run: node --experimental-strip-types --test scripts/test-objective-review.mjs
      - name: Real development API E2E (credential-required tests SKIP explicitly)
        run: node --test scripts/test-career-live-http.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Start isolated site and run actual Chromium dashboard/browser smoke
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/dashboard/student > /dev/null; then break; fi
            sleep 1
          done
          node scripts/test-audience-browser.mjs
      - name: Upload isolated browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lanx00-integrated-browser-evidence
          path: browser-evidence/
          if-no-files-found: ignore
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck development Edge Function
        run: deno check --config supabase/functions/career/deno.json supabase/functions/career/index.ts

      - name: Verify development Edge rejects unauthenticated HTTP
        run: |
          set -eu
          endpoint='https://kzjvvwuyigiclryoqpkv.supabase.co/functions/v1/career/access'
          anonymous=$(curl --silent --show-error --max-time 20 -o /tmp/lanx_anonymous -w '%{http_code}' "$endpoint")
          forged=$(curl --silent --show-error --max-time 20 -o /tmp/lanx_forged -w '%{http_code}' -H 'Authorization: Bearer invalid-synthetic-token' "$endpoint")
          case "$anonymous" in 401|403) ;; *) echo "FAIL anonymous HTTP status: $anonymous"; exit 1;; esac
          case "$forged" in 401|403) ;; *) echo "FAIL forged JWT status: $forged"; exit 1;; esac
          echo 'PASS: anonymous and forged-JWT requests denied by development Edge endpoint'
