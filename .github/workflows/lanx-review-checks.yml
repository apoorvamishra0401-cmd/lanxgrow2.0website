name: LanXgrow isolated review checks
on:
  push:
    branches:
      - dev/lanx00-app-integration-20261111
      - dev/lanx-founder-review-20261110
      - dev/lanx01-role-dashboard-20261111
      - dev/lanx02-interview-assessment-20261111
      - dev/lanx03-ai-soul-evaluation-20261111
      - dev/lanx04-admin-access-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/test-audience-routes.mjs
      - run: node --experimental-strip-types --test scripts/test-interview-lifecycle.mjs scripts/test-interview-transport.mjs scripts/test-interview-http.mjs
      - run: node --test scripts/test-evaluation.mjs src/admin/tests/server-access.test.mjs
      - run: npm run typecheck
      - run: npm run build
