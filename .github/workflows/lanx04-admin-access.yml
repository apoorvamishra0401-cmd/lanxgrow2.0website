name: LANX-04 isolated access checks
on:
  push:
    branches:
      - dev/lanx04-admin-access-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9f683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test src/admin/tests/server-access.test.mjs
      - run: npm run typecheck
      - run: npm run build
